<svg xmlns="http://www.w3.org/2000/svg" width="700" height="24" viewBox="0 0 700 24" role="img" aria-labelledby="title description">
  <title id="title">王子瑜的个人介绍</title>
  <desc id="description">AI 产品经理。先让它跑起来，再让它安静下来。</desc>
  <style>
    .message, .caret { fill: #57606a; }
    .message {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
    }
    .window { width: 620px; animation: reveal 6.5s steps(25, end) infinite; }
    .caret {
      x: 660px;
      animation: follow 6.5s steps(25, end) infinite, blink 0.75s step-end infinite;
    }
    @keyframes reveal {
      0% { width: 0; }
      62%, 88% { width: 620px; }
      100% { width: 0; }
    }
    @keyframes follow {
      0% { x: 40px; }
      62%, 88% { x: 660px; }
      100% { x: 40px; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-color-scheme: dark) {
      .message, .caret { fill: #8c959f; }
    }
    @media (prefers-reduced-motion: reduce) {
      .window { width: 620px; animation: none; }
      .caret { x: 660px; animation: none; }
    }
  </style>
  <defs>
    <clipPath id="message-window">
      <rect class="window" x="40" y="0" height="24" />
    </clipPath>
  </defs>
  <text class="message" x="40" y="17" textLength="620" lengthAdjust="spacingAndGlyphs" clip-path="url(#message-window)">AI 产品经理 · 先让它跑起来，再让它安静下来</text>
  <rect class="caret" y="3" width="2.5" height="18" rx="1" />
</svg>
